<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MusicSMX 迷你播放窗</title>
<style>
  /* 默认值只是兜底：主界面会把真实主题变量（accent/底色/文字色）推过来覆盖，
     换主题色 / 界面底色时小窗实时跟着变。 */
  :root {
    --bg: #12141a;
    --bg-elev: #1a1d26;
    --text: #e8eaf0;
    --text-dim: #8b90a0;
    --text-faint: #5a5f70;
    --accent: #ff6b3d;
    --border: rgba(255,255,255,0.07);
    --hover: rgba(255,255,255,0.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
  [hidden] { display: none !important; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: transparent;
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .card {
    position: absolute;
    inset: 0;                     /* 卡片铺满窗口：留边距会在透明区域里露出阴影，看着像一圈脏边 */
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    /* 不加 box-shadow：透明窗口里外发光/投影都会在圆角外形成半透明暗晕，用户明确要求去掉 */
    padding: 16px 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .cover {
    position: relative;
    width: 148px;
    height: 148px;
    border-radius: 12px;
    background: var(--bg-elev);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    flex-shrink: 0;
    cursor: pointer;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover::after {
    content: '点击打开主界面';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 0 4px;
    background: linear-gradient(transparent, rgba(0,0,0,0.72));
    color: #fff;
    font-size: 11px;
    text-align: center;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .cover:hover::after { opacity: 1; }
  .cover .ph { color: var(--text-faint); font-size: 40px; }
  /* 控制行：上一首 | 播放 | 下一首，三个键等间距、播放键几何居中（对称）。
     2026-11-19：播放键 50→44（缩小一号），上一首/下一首加一圈浅浅的圆底，
     和播放键形成主次分明的一排，hover 时圆底微微提亮。 */
  .controls {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-top: 12px;
  }
  .ctl {
    width: 40px; height: 40px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.06); color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, color .15s, transform .1s;
  }
  .ctl:hover { background: rgba(255,255,255,0.11); color: var(--text); }
  .ctl:active { transform: scale(.9); }
  .ctl.play {
    width: 44px; height: 44px;
    background: var(--accent); color: #fff;
    box-shadow: 0 3px 14px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .ctl.play:hover { filter: brightness(1.12); background: var(--accent); }
  .ctl.play svg { width: 21px; height: 21px; }
  /* 功能行（参考图第二行）：❤收藏 | 歌名 | 播放模式，左右图标 + 中间文字 */
  .feat-row {
    width: 100%; margin-top: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .feat-ic {
    flex: none; width: 32px; height: 32px; border: none; border-radius: 8px;
    background: transparent; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .feat-ic:hover { background: var(--hover); }
  .feat-ic svg { width: 18px; height: 18px; }
  .feat-ic.faved { color: #ff5252; }
  /* 模式激活不用主题橙（用户 2026-11-20 要求）：图标本身就是三态可辨的 */
  .feat-ic.active { color: var(--text); }
  .feat-text {
    flex: 1; min-width: 0; text-align: center;
    font-size: 14px; line-height: 1.3; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: default;
  }
  /* 音量行：喇叭可点（单击静音/取消静音），滑轨占满 */
  .volume-row {
    width: 100%; margin-top: 10px; padding: 0 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .vol-btn {
    width: 24px; height: 24px; flex: none;
    border: none; border-radius: 6px; background: transparent;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .vol-btn:hover { background: var(--hover); color: var(--text); }
  .vol-btn.muted { color: var(--text-faint); }
  .vol-btn svg { width: 18px; height: 18px; }
  .vol-range {
    flex: 1; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.14);
    border-radius: 99px;
    cursor: pointer;
  }
  .vol-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .vol-range::-moz-range-thumb {
    width: 12px; height: 12px; border: none; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  /* 退出行（参考图最底行样式）：电源图标 + 「退出MusicSMX」占主宽，右侧新增歌词开关 */
  .exit-row {
    width: 100%; margin-top: auto; padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex; align-items: stretch; gap: 6px;
  }
  .exit-btn {
    display: flex; align-items: center; gap: 9px;
    flex: 1; min-width: 0;
    padding: 6px 8px;
    border: none; border-radius: 8px; background: transparent;
    color: var(--text-dim); font-size: 12px; line-height: 1.2;
    font-family: inherit; text-align: left;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .exit-btn:hover { background: var(--hover); color: var(--text); }
  .exit-btn svg { width: 16px; height: 16px; flex: none; }
  /* 歌词开关：只负责桌面/任务栏歌词的开关，激活态用主题色点一下就知道 */
  .lyr-btn {
    width: 36px; flex: none;
    border: none; border-radius: 8px; background: transparent;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .lyr-btn:hover { background: var(--hover); color: var(--text); }
  .lyr-btn.active { color: var(--accent); }
  .lyr-btn svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="cover" id="cover" title="点击打开主界面"><span class="ph">♪</span></div>
    <div class="controls">
      <button class="ctl" id="prev" title="上一首">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
      </button>
      <button class="ctl play" id="play" title="播放 / 暂停">
        <svg id="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg id="ic-pause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>
      </button>
      <button class="ctl" id="next" title="下一首">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
      </button>
    </div>
    <div class="feat-row">
      <button class="feat-ic" id="fav" title="收藏 / 取消收藏" aria-label="收藏"></button>
      <div class="feat-text" id="feat-text">未在播放</div>
      <button class="feat-ic" id="mode" title="播放模式：列表循环"></button>
    </div>
    <div class="volume-row">
      <button class="vol-btn" id="vol-mute" title="静音 / 取消静音" aria-label="静音">
        <svg id="vol-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path id="vol-wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.8a7.5 7.5 0 0 1 0 10.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg id="vol-off" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden>
          <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M16 9.8l5 4.4M21 9.8l-5 4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <input id="volume" class="vol-range" type="range" min="0" max="100" value="5" title="音量" aria-label="音量">
    </div>
    <div class="exit-row">
      <button class="exit-btn" id="quit" title="退出 MusicSMX" aria-label="退出 MusicSMX">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M6.3 6.6a8 8 0 1 0 11.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>退出MusicSMX</span>
      </button>
      <button class="lyr-btn" id="lyric-toggle" title="开启歌词" aria-label="桌面歌词开关">
        <!-- 字幕/歌词图标：圆角框 + 两行词 -->
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/>
          <path d="M6.5 12.5h6M6.5 15.5h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
  <script src="mini-player.js"></script>
</body>
</html>
